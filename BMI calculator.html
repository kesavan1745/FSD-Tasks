<!DOCTYPE html>
<html>
<head>
    <title>BMI Calculator</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            color: green;
        }
        .box{
            border: 1px solid gray;
            border-radius: 20px;
            border: 7px solid black;
            width: 300px;
            margin: 50px auto;
            padding: 20px;
            margin-top: 100px;
            box-shadow: 10px 20px 5 0px green;
        }
        input {
            padding: 8px;
            margin: 5px;
            color: red;
            font-size: 20px;
        }
        #k7{
            padding: 8px 15px;
            background-color: brown;
            border-radius: 7px;
        }
        #mani{
            padding: 8px 15px;
            background-color: blue;
            border-radius: 7px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>BMI Calculator</h2>

        <input type="number" id="weight" placeholder="Weight in kg">
        <br>
        <input type="number" id="height" placeholder="Height in meter">
        <br><br>
        <button id="k7" onclick="calculateBMI()">Calculate BMI</button>
        <button id="mani" onclick="clearBMI()">clear</button>
        <h3 id="result"></h3>
   </div>

    <script>
        function calculateBMI() {
            let weight = document.getElementById("weight").value;
            let height = document.getElementById("height").value;
              let bmi = weight / ((height / 100) * (height / 100));
            document.getElementById("result").innerHTML = "BMI: " + bmi.toFixed(2);
        }
        function clearBMI(){
            let weight = document.getElementById("weight").value="";
            let height = document.getElementById("height").value="";
            document.getElementById("result").innerHTML ="";
        }
    </script>
</body>
</html>
